name: Release (fork)

on:
  push:
    tags:
      - "v*-fork.*"

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Read package manager version from package source
        id: package-manager
        shell: bash
        run: node -e 'const p=require("./package.json"); if(p.devEngines.packageManager.name!=="pnpm") process.exit(1); console.log("version="+p.devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.package-manager.outputs.version }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '@pattobrien:registry=https://npm.pkg.github.com' >> .npmrc
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
      - name: Publish to GitHub Packages
        run: node scripts/fork-publish.ts "${GITHUB_REF_NAME#v}"
